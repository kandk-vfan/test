name: check video status (hjm)

on:
  workflow_dispatch: {}

jobs:
  check-status:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: hjm

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: run status check
        run: node check_status.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: commit status.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add status.json
          git commit -m "auto update status.json" || echo "no changes"
          git push origin HEAD:hjm

      - name: trigger deploy
        run: gh workflow run deploy.yml --ref hjm
        env:
          GH_TOKEN: ${{ github.token }}
